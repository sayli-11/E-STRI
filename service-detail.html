<!DOCTYPE html>
<html>
<head>
<title>E-STRI Service Details</title>

<style>

body{
font-family: Arial, sans-serif;
margin:0;
background:#f4f7fb;
}

header{
background:#3A86FF;
color:white;
padding:15px;
text-align:center;
font-size:24px;
}

.container{
width:90%;
margin:auto;
margin-top:30px;
}

/* SERVICE INFO */

.service-info{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
margin-bottom:30px;
}

.service-info h2{
color:#3A86FF;
}

/* STEPS DESIGN */

.steps{
display:flex;
justify-content:center;
gap:40px;
flex-wrap:wrap;
margin:40px 0;
}

.step{
background:white;
padding:20px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
transition:0.4s;
width:150px;
}

.step:hover{
transform:translateY(-10px) scale(1.05);
}

.step img{
width:70px;
}

/* VENDOR CARDS */

.vendor-title{
font-size:28px;
color:#3A86FF;
margin-top:40px;
}

.vendor-list{
display:flex;
flex-wrap:wrap;
gap:20px;
margin-top:20px;
}

.vendor-card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.1);
width:220px;
}

.vendor-card button{
background:#3A86FF;
border:none;
padding:10px;
color:white;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

.vendor-card button:hover{
background:#265df2;
}
.service-image{
text-align:center;
margin-top:20px;
}

.service-image img{
width:420px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
transition:0.4s;
}

.service-image img:hover{
transform:scale(1.05);
}

</style>
</head>

<body>

<header>
E-STRI Service Details
</header>

<div class="container">

<div class="service-info">
<h2 id="serviceName">Service</h2>
<p id="serviceText"></p>
</div>
<div class="service-image">
<img id="servicePic" src="" width="400">
</div>

<!-- SERVICE STEPS -->

<div class="steps">

<div class="step">
<img src="pickup.png">
<p>Pickup</p>
</div>

<div class="step">
<img src="wash.png">
<p>Cleaning</p>
</div>

<div class="step">
<img src="iron.png">
<p>Ironing</p>
</div>

<div class="step">
<img src="delivery.png">
<p>Delivery</p>
</div>

</div>

<h3 class="vendor-title">Available Vendors</h3>

<div id="vendorList" class="vendor-list"></div>

</div>

<script>

window.onload = async function(){

const service = localStorage.getItem("selectedService");

document.getElementById("serviceName").innerText =
service.toUpperCase() + " Service";

/* SERVICE DESCRIPTION */

if(service==="ironing"){
document.getElementById("serviceText").innerText =
"Get wrinkle-free clothes with professional steam ironing. Vendors ensure cloth safety and perfect finishing.";
}

if(service==="laundry"){
document.getElementById("serviceText").innerText =
"Complete washing, drying and folding service using eco-friendly detergents and advanced cleaning methods.";
}

if(service==="dryclean"){
document.getElementById("serviceText").innerText =
"Premium dry cleaning for delicate fabrics like suits, sarees and coats with stain removal technology.";
}

if(service==="shoe"){
document.getElementById("serviceText").innerText =
"Deep shoe cleaning, polishing and deodorizing for sports shoes, leather shoes and sneakers.";
}

if(service==="curtain"){
document.getElementById("serviceText").innerText =
"Curtain washing and steam pressing service to remove dust, allergens and restore freshness.";
}

if(service==="ironing"){
document.getElementById("servicePic").src="ironing.jpg";
}

if(service==="laundry"){
document.getElementById("servicePic").src="laundry.jpg";
}

if(service==="dryclean"){
document.getElementById("servicePic").src="dry cleaning.jpg";
}

if(service==="shoe"){
document.getElementById("servicePic").src="shoe.jpg";
}

if(service==="curtain"){
document.getElementById("servicePic").src="curtain.jpg";
}

/* FETCH VENDORS */

const res = await fetch("/api/vendors");
const data = await res.json();

let html = "";

data.forEach(v=>{
if(v.serviceType === service){
html += `
<div class="vendor-card">
<h3>${v.name}</h3>
<p>Area: ${v.area}</p>
<p>Price: ${v.price}</p>
<p>⭐ ${v.rating}</p>
<button onclick="bookVendor('${v.name}')">Book</button>
</div>
`;
}
});

if(html===""){
html="<p>No vendors available for this service.</p>";
}

document.getElementById("vendorList").innerHTML = html;

}

/* BOOK BUTTON FUNCTION */

function bookVendor(name){
localStorage.setItem("selectedVendor",name);
window.location.href="index.html#booking";
}

</script>

</body>
</html>
